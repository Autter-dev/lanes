# cargo-deny: every dependency must use one of these licenses.
# Lanes ships under AGPL-3.0-only. Dependencies stay permissive, so
# nothing else's copyleft terms get mixed in.

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  # Public-domain-like, with no conditions at all (interprocess's recvmsg and doctest-file).
  "0BSD",
]
confidence-threshold = 0.9
# Our own crates are AGPL-3.0-only.
exceptions = [
  { crate = "lane", allow = ["AGPL-3.0-only"] },
  { crate = "laned", allow = ["AGPL-3.0-only"] },
  { crate = "lane-core", allow = ["AGPL-3.0-only"] },
  { crate = "lane-tui", allow = ["AGPL-3.0-only"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
