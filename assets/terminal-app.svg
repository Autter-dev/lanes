<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="t d">
  <title id="t">The Lanes terminal app (preview)</title>
  <desc id="d">A mockup of the lane terminal app listing four lanes with their agent, status, changes, tests and URL, and a warning that two lanes are editing the same function.</desc>
