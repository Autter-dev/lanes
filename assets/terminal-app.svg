  <text x="44" y="98" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#eef2ff">Lanes<tspan fill="#2cffd0">.</tspan></text>
  <text x="140" y="98" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#aab4d4">4 lanes · 2 agents running · 1 conflict</text>
