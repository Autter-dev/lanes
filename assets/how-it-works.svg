<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="t d">
  <title id="t">How Lanes works</title>
  <desc id="d">Your repo feeds three lanes, each with its own agent, URL, port and database. Lanes warns when two lanes edit the same file, and lane promote turns the best lane into one clean pull request.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1124"/><stop offset="1" stop-color="#060914"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="600" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="600" rx="28" fill="url(#grid)"/>
  
  <g>
    <rect x="60" y="215" width="280" height="190" rx="18" fill="#141d3a" stroke="#2a3762" stroke-width="1.5"/>
    <g transform="translate(88 247)" fill="none" stroke="#f5a11a" stroke-width="2.4" stroke-linecap="round">
      <circle cx="0" cy="0" r="6"/><circle cx="0" cy="44" r="6"/><circle cx="26" cy="18" r="6"/>
      <path d="M0 6 V38 M0 30 C0 22 26 30 26 24"/>
    </g>
    <text x="130" y="259" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" font-weight="700" fill="#eef2ff">your-repo</text>
    <text x="130" y="283" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#aab4d4">your Git, your GitHub</text>
    <line x1="84" y1="315" x2="316" y2="315" stroke="#2a3762"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#aab4d4">
      <tspan x="88" y="343">.git</tspan>
      <tspan x="88" y="365">node_modules/</tspan>
      <tspan x="88" y="387">.env</tspan>
    </text>
  </g><path d="M340 310.0 C410 310.0 400 151.0 470 151.0" fill="none" stroke="#f5a11a" stroke-width="2.5" stroke-dasharray="7 7" opacity="0.85"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path><path d="M810 151.0 C880 151.0 870 310.0 940 310.0" fill="none" stroke="#f5a11a" stroke-width="2.5" stroke-dasharray="7 7" opacity="0.5"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path>
  <g>
    <rect x="470" y="92" width="340" height="118" rx="16" fill="#141d3a" stroke="#f5a11a" stroke-width="2"/>
    <rect x="470" y="92" width="6" height="118" rx="3" fill="#f5a11a"/>
    <circle cx="500" cy="122" r="6" fill="#f5a11a"/>
    <text x="516" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="700" fill="#eef2ff">fix-auth</text>
    <text x="790" y="128" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#aab4d4">Claude Code</text>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#aab4d4">
      <tspan x="500" y="162">fix-auth.localhost <tspan fill="#6b7699">:3001</tspan></tspan>
      <tspan x="500" y="186">db: app_fix_auth</tspan>
    </text>
  </g><path d="M340 310.0 C410 310.0 400 303.0 470 303.0" fill="none" stroke="#2cffd0" stroke-width="2.5" stroke-dasharray="7 7" opacity="0.85"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path><path d="M810 303.0 C880 303.0 870 310.0 940 310.0" fill="none" stroke="#2cffd0" stroke-width="2.5" stroke-dasharray="7 7" opacity="0.5"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path>
  <g>
    <rect x="470" y="244" width="340" height="118" rx="16" fill="#141d3a" stroke="#2cffd0" stroke-width="2"/>
    <rect x="470" y="244" width="6" height="118" rx="3" fill="#2cffd0"/>
    <circle cx="500" cy="274" r="6" fill="#2cffd0"/>
    <text x="516" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="700" fill="#eef2ff">add-tests</text>
    <text x="790" y="280" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#aab4d4">Codex</text>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#aab4d4">
      <tspan x="500" y="314">add-tests.localhost <tspan fill="#6b7699">:3002</tspan></tspan>
      <tspan x="500" y="338">db: app_add_tests</tspan>
    </text>
  </g><path d="M340 310.0 C410 310.0 400 455.0 470 455.0" fill="none" stroke="#5b8cff" stroke-width="2.5" stroke-dasharray="7 7" opacity="0.85"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path><path d="M810 455.0 C880 455.0 870 310.0 940 310.0" fill="none" stroke="#5b8cff" stroke-width="2.5" stroke-dasharray="7 7" opacity="0.5"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path>
  <g>
    <rect x="470" y="396" width="340" height="118" rx="16" fill="#141d3a" stroke="#5b8cff" stroke-width="2"/>
    <rect x="470" y="396" width="6" height="118" rx="3" fill="#5b8cff"/>
    <circle cx="500" cy="426" r="6" fill="#5b8cff"/>
    <text x="516" y="432" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="700" fill="#eef2ff">new-billing</text>
    <text x="790" y="432" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#aab4d4">Cursor</text>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#aab4d4">
      <tspan x="500" y="466">new-billing.localhost <tspan fill="#6b7699">:3003</tspan></tspan>
      <tspan x="500" y="490">db: app_new_billing</tspan>
    </text>
  </g>
  <g transform="translate(640.0 227.0)">
    <rect x="-118" y="-14" width="236" height="28" rx="14" fill="#2a1416" stroke="#ff6b6b" stroke-width="1.5"/>
    <path d="M-98 6 L-90 -8 L-82 6 Z" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linejoin="round"/>
    <text x="-72" y="5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#ffc2c2">both lanes editing <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">auth.ts</tspan></text>
  </g>
  <g>
    <rect x="940" y="215" width="280" height="190" rx="18" fill="#141d3a" stroke="#2cffd0" stroke-width="2"/>
    <circle cx="980" cy="257" r="16" fill="#2cffd0" fill-opacity="0.15" stroke="#2cffd0" stroke-width="2"/>
    <path d="M972 257 l6 6 l11 -12" fill="none" stroke="#2cffd0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1008" y="255" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef2ff">One clean PR</text>
    <text x="1008" y="277" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#aab4d4">lane promote fix-auth</text>
    <line x1="964" y1="315" x2="1196" y2="315" stroke="#2a3762"/>
    <text font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#aab4d4">
      <tspan x="968" y="343">who (and which agent) wrote what</tspan>
      <tspan x="968" y="365">tests run in the lane</tspan>
      <tspan x="968" y="387">protected paths need a human</tspan>
    </text>
  </g>
  <g transform="translate(200.0 560)">
    <circle cx="0" cy="-34" r="14" fill="#f5a11a"/>
    <text x="0" y="-29" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#060914">1</text>
    <text x="0" y="2" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#eef2ff">Your repo</text>
  </g>
  <g transform="translate(640.0 560)">
    <circle cx="0" cy="-34" r="14" fill="#f5a11a"/>
    <text x="0" y="-29" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#060914">2</text>
    <text x="0" y="2" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#eef2ff">lane new: one lane per agent</text>
  </g>
  <g transform="translate(1080.0 560)">
    <circle cx="0" cy="-34" r="14" fill="#f5a11a"/>
    <text x="0" y="-29" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#060914">3</text>
    <text x="0" y="2" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#eef2ff">lane promote: ship the best</text>
  </g>
</svg>
