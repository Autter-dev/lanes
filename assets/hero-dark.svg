<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="t d">
  <title id="t">Lanes</title>
  <desc id="d">Lanes: lighter agents. Four agents move along four parallel lanes: fix-auth, add-tests, new-billing and refactor-db.</desc>
  <rect x="0.5" y="0.5" width="1279" height="599" rx="16" fill="#0B0B0C" stroke="#26262A"/>
<text x="48" y="56" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2" fill="#F4F4EF">LANES</text>
  <text x="640.0" y="56" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2" fill="#7A7A74">RUN MANY CODING AGENTS ON ONE REPO</text>
  <text x="1232" y="56" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2" fill="#7A7A74">EARLY PREVIEW — 2026</text>
  <line x1="48" y1="80" x2="1232" y2="80" stroke="#26262A"/>
  <text x="40" y="308" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="232" font-weight="700" letter-spacing="-11" fill="#F4F4EF">Lanes<tspan fill="#2CFFD0">.</tspan></text>
  <text font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="end">
