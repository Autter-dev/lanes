<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="t d">
  <title id="t">Lanes</title>
  <desc id="d">Lanes: lighter agents. Four agents move along four parallel lanes: fix-auth, add-tests, new-billing and refactor-db.</desc>
