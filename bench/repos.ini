# The repos benchmark 1 runs against, each pinned to a commit so every run measures the same
# tree. bench/run.sh and bench/run.ps1 read this file; bench/README.md says how to add a repo.
#
# Keys:
#   url        where to clone from; `.` is this repo
#   commit     the pinned commit (the default branch's HEAD on the day it was pinned)
#   pinned     that day
#   install    the dependency install, run the same way in a worktree and in Lanes' `_base`
#   test       a fixed, small test subset, run in a fresh copy: its time is the time to the
#              first passing test
#   env        variables both ways run with; defaults, so a value already set in your shell wins
#   variants   baselines to measure (default `stock`); env.<variant> holds what each changes,
#              and always applies
#   requires   programs that must be on PATH
#   services   servers that must answer on localhost: postgres (5432, or $PGPORT), redis (6379)
#   platforms  where it runs: macos, linux, windows
# Any key can have a per-OS form, like `test.windows`, which wins on that OS.

[astro]
url = https://github.com/withastro/astro.git
commit = 70834bbea43695c563358ea055d32ecb5e0a78dd
pinned = 2026-10-18
# pnpm 11.28.4, from Astro's packageManager (corepack picks it).
install = pnpm install --frozen-lockfile
# One package: a transpile-only build of @astrojs/internal-helpers, then its 90 node:test tests.
test = pnpm --filter @astrojs/internal-helpers run build:ci && pnpm --filter @astrojs/internal-helpers run test
# trustLockfile skips pnpm 11's check of every lockfile entry against the registry (Astro's
# trustPolicy and minimumReleaseAge turn it on). It repeats in every new folder and is network
# bound, about 45 s: we leave it out of both ways, so the baseline doesn't pay for it.
env = PNPM_CONFIG_TRUST_LOCKFILE=true PNPM_CONFIG_VIRTUAL_STORE_TYPE=project
# The baseline twice: stock pnpm, a node_modules per copy; and pnpm's global virtual store, one
# shared store linked into every copy. On Windows the global store's first test fails (pnpm
# 11.28.4, Node 24): astro-scripts can't resolve piccolore through the store's links. The
# results record that as a failed first test.
variants = stock global
env.global = PNPM_CONFIG_VIRTUAL_STORE_TYPE=global
requires = git node pnpm
platforms = macos linux windows

[ruff]
url = https://github.com/astral-sh/ruff.git
commit = 443f8b0ffa8f7dfe0a5a5300a5ec63349615df99
pinned = 2026-10-18
install = cargo fetch --locked
# One crate: 33 crates to compile, then 54 unit tests and 4 doctests. The install is a fetch,
# so the first test includes that compile, in every copy.
test = cargo test --locked -p ruff_python_ast
requires = git cargo
platforms = macos linux windows

[saleor]
url = https://github.com/saleor/saleor.git
commit = 0c0e2697cc72aa999f7786ae8aeda7665bd4285f
pinned = 2026-10-18
install = uv sync --locked
# One worker (-n 0) and --reuse-db: the warmup run migrates the test database once (minutes);
# the timed runs reuse it, as Saleor's own CI does.
test = uv run --locked pytest -n 0 --reuse-db -q saleor/core/tests/test_weight.py saleor/core/tests/test_anonymize.py
env = DATABASE_URL=postgres://saleor:saleor@localhost:5432/saleor
requires = git uv
services = postgres
# Not Windows: the dev dependencies include memray, which has no Windows build.
platforms = macos linux

[mastodon]
url = https://github.com/mastodon/mastodon.git
commit = 7f90e0fd72457065096d13cdcbfd0713c88de933
pinned = 2026-10-18
install = bundle install
# A spec that needs no compiled assets; db:setup is what CI runs first. Rails needs libvips to
# boot, and every spec empties Redis database 1: use a Redis you don't mind losing.
test = bin/rails db:setup && bundle exec rspec spec/lib/hashtag_normalizer_spec.rb
env = RAILS_ENV=test BUNDLE_FROZEN=true
requires = git ruby bundle
services = postgres redis
platforms = macos linux

[lanes]
# This repo, the quick target: cloned from the checkout that holds bench/. Only run when named.
url = .
commit = 68385695d100dcd796e80459fd7616b4a6fbff19
pinned = 2026-10-18
install = cargo fetch --locked
test = cargo test --locked -p lane-core --lib project::tests
requires = git cargo
platforms = macos linux windows
