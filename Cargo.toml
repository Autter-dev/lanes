[workspace]
resolver = "3"
members = ["crates/lane", "crates/laned", "crates/lane-core"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
authors = ["Autter <contact@autter.dev>"]
repository = "https://github.com/autter-dev/lanes"
homepage = "https://autter.dev"
publish = false

[workspace.dependencies]
lane-core = { path = "crates/lane-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
