[workspace]
resolver = "3"
members = ["crates/lane", "crates/laned", "crates/lane-core", "crates/lane-tui"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
authors = ["Autter <contact@autter.dev>"]
repository = "https://github.com/autter-dev/lanes"
homepage = "https://autter.dev"
publish = false

[workspace.dependencies]
lane-core = { path = "crates/lane-core" }
lane-tui = { path = "crates/lane-tui" }
etcetera = "0.11"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
