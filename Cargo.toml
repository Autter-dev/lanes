[workspace]
resolver = "3"
members = ["crates/lane", "crates/laned", "crates/lane-core", "crates/lane-tui"]

[workspace.package]
version = "0.0.9"
edition = "2024"
# 1.89 for std::fs::File::lock (the state store's single-writer lock).
rust-version = "1.89"
license = "AGPL-3.0-only"
authors = ["Autter <contact@autter.dev>"]
repository = "https://github.com/autter-dev/lanes"
homepage = "https://autter.dev"
publish = false

[workspace.dependencies]
lane-core = { path = "crates/lane-core" }
lane-tui = { path = "crates/lane-tui" }
etcetera = "0.11"
libc = "0.2"
ratatui = "0.30"
reflink-copy = "0.1"
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt"] }
toml = "1"
interprocess = { version = "2.4", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
