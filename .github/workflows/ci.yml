name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Btrfs and XFS runners, and a Windows Dev Drive, come later for clone tests.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  clones:
    # Copy-on-write clones on each filesystem that has them. APFS is covered by the macOS test
    # job above; these make a Btrfs, XFS or ReFS disk and run the clone tests on it.
    name: Clones (${{ matrix.fs }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fs: btrfs, os: ubuntu-latest }
          - { fs: xfs, os: ubuntu-latest }
          - { fs: refs, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Make a ${{ matrix.fs }} disk
        if: matrix.fs != 'refs'
        env:
          FS: ${{ matrix.fs }}
        run: |
          sudo apt-get update -q
          if [ "$FS" = btrfs ]; then sudo apt-get install -y -q btrfs-progs; else sudo apt-get install -y -q xfsprogs; fi
          truncate -s 2G "$RUNNER_TEMP/disk.img"
          if [ "$FS" = btrfs ]; then mkfs.btrfs -q "$RUNNER_TEMP/disk.img"; else mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/disk.img"; fi
          sudo mkdir -p /mnt/lanes
          sudo mount -o loop "$RUNNER_TEMP/disk.img" /mnt/lanes
          sudo chown "$USER" /mnt/lanes
          echo "LANE_TEST_CLONE_DIR=/mnt/lanes" >> "$GITHUB_ENV"
      - name: Make a ReFS disk
        if: matrix.fs == 'refs'
        shell: pwsh
        run: |
          $vhd = "$env:RUNNER_TEMP\refs.vhdx"
          $script = @"
          create vdisk file="$vhd" maximum=4096 type=expandable
          attach vdisk
          create partition primary
          format fs=refs quick label=lanes
          assign letter=R
          "@
          $script | Set-Content "$env:RUNNER_TEMP\refs.txt"
          diskpart /s "$env:RUNNER_TEMP\refs.txt"
          New-Item -ItemType Directory R:\lanes | Out-Null
          "LANE_TEST_CLONE_DIR=R:\lanes" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      # Every test, with repos and lanes on this disk: the engine, the hooks and the CLI, not
      # only the clone backend. On these disks a lane must be cloned, never copied.
      - name: Every test on ${{ matrix.fs }}
        run: cargo test --all

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  site:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx astro check
      - run: npm run build

  install-count:
    name: Install count service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/install-count
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/install-count/package-lock.json
      - run: npm ci
      - run: npm run check
      # The SQL runs against a local D1, the same SQLite runtime Cloudflare uses.
      - run: npm test
      # Bundles the Worker the way a deploy would, without deploying.
      - run: npx wrangler deploy --dry-run --outdir dist
